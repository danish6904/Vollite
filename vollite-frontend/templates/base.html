<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}volLite{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    /* Background video */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -2;
    }

    /* Overlay wrapper */
    .overlay-content {
      position: relative;
      z-index: 1;
      color: white;
      padding: 2rem;
      padding-top: 6rem;   /* prevent overlap with navbar */
      padding-bottom: 4rem; /* prevent overlap with footer */
      min-height: 100vh;   /* ensure content stretches full height */
    }

    /* Dark overlay (optional, only applied if overlay-dark class is present) */
    .overlay-dark::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.45);
      z-index: -1;
    }

    /* NAVBAR */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: rgba(10, 10, 30, 0.9); /* semi-transparent */
    }
    .nav-brand {
      font-size: 1.7rem;   /* logo size */
      font-weight: 700;
      color: #4da6ff;
    }
    .nav-links {
      display: flex;
      list-style: none;
      gap: 1.5rem;
    }
    .nav-links a {
      color: white;
      text-decoration: none;
    }

    /* FOOTER */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      text-align: center;
      padding: 1rem;
      background: rgba(10, 10, 30, 0.9);
      color: white;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <!-- Background Video -->
  {% if video_file %}
  <video autoplay muted loop id="bg-video">
    <source src="{{ url_for('static', filename=video_file) }}" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>
  {% endif %}

  <!-- NAVBAR -->
  <nav class="nav">
    <div class="nav-brand">volLite</div>
    <ul class="nav-links">
      <li><a href="{{ url_for('home') }}">Home</a></li>
      <li><a href="{{ url_for('about') }}">About</a></li>
      <li><a href="{{ url_for('contact') }}">Contact</a></li>
      <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
    </ul>
  </nav>

  <!-- MAIN CONTENT (overlay optional) -->
  <div class="overlay-content {% if not no_overlay %}overlay-dark{% endif %}">
    <main class="container">
      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div>© 2025 volLite • Memory Forensics Assistant</div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
